# 锁定 Rust 工具链版本，避免 CI 的 `dtolnay/rust-toolchain@stable` 随时间漂移，
# 导致同一提交在不同时间构建出不可复现的产物。
#
# components / targets 一并列全：rustup 依据本文件自动安装工具链时会连它们一起装好，
# CI 与本地因此无需再单独 `rustup component add` / `rustup target add`（Android 交叉目标
# 供 `.github/workflows/build.yaml` 的 `cargo build --target ...` 使用）。
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
