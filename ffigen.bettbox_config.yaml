# 为 Rust 侧 `rust/bettbox-native` 的配置管道窄 C ABI 生成 Dart 绑定。
#
# 用法（仓库根）：dart run ffigen --config ffigen.bettbox_config.yaml
# 生成物 `lib/rust/generated/bettbox_config_ffi.dart` 随源码入库，日常构建不需要重跑；
# 改了 `include/bettbox_config.h` 或 `src/ffi.rs` 的签名后必须重跑并一并提交。
#
# 注意：不要动 pubspec.yaml 里那个默认 `ffigen:` 段——它服务的是 Android 的
# libclash 头文件（`libclash/` 不入库，所以那个配置只在本地有产物时可跑）。
name: BettboxConfigFFI
description: 由 ffigen 从 rust/bettbox-native/include/bettbox_config.h 生成，勿手改。
output: 'lib/rust/generated/bettbox_config_ffi.dart'
# ffigen 需要一个 libclang。本机没装 LLVM，这里指向随 IDA 附带的那份；
# 换机器时把它改成自己的 LLVM 安装目录（`<LLVM>/bin/libclang.dll`）或直接删掉这一项
# ——删掉后 ffigen 会回落到 `clang -print-file-name=libclang.dll` 的默认查找。
llvm-path:
  - 'C:/Users/bypassnro/Documents/IDA/libclang.dll'
headers:
  entry-points:
    - 'rust/bettbox-native/include/bettbox_config.h'
  include-directives:
    - 'rust/bettbox-native/include/bettbox_config.h'
functions:
  include:
    - 'bb_.*'
preamble: |
  // ignore_for_file: type=lint, unused_import, camel_case_types, non_constant_identifier_names, constant_identifier_names, unused_element
