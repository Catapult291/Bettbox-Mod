name: proxy
description: A new Flutter plugin project.
version: 0.0.1
homepage:

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # 本包只剩 macOS / Linux 的纯 Dart 实现（`Process.run` 调 networksetup / gsettings）。
  # Windows 的系统代理已改由 Rust 侧 `bettbox_native` 承担（见
  # `rust/bettbox-native/src/system_proxy.rs` 与 `lib/common/system_proxy.dart`），原先的
  # `windows/` 原生插件（C++ 调 InternetSetOptionW）已删除；因此这里不再声明
  # `plugin.platforms`——留着 windows 平台会让 Flutter 去构建一个不存在的目录。
