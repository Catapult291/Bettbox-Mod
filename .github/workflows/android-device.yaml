name: android-device

# 设备端集成测试（integration_test/android_rust_pipeline_test.dart）只在 x86_64 模拟器腿上跑。
#
# 它验的是主机上验不了的部分：libbettbox_native.so 真的随 APK 分发、能被 Android 的
# 平台加载器按名解析（APK 内的库不在 dart:io 能枚举的路径上，主机无法预检）、
# Android 分支真的生效、脚本引擎在设备架构上真的求值。管道逐字段正确性由 rust 工作流的
# `cargo test`（含 golden）负责，两者不重叠。
#
# 不放进 build.yaml：那边只在打 tag 与手动触发时跑，而这条要当常规回归网。
#
# 架构矩阵（B⑬ 后半，2026-10-13）：
#   - x86_64 / ubuntu：KVM 加速模拟器，跑完整设备端集成测试（4 用例）。
#   - arm64-v8a / ubuntu（无模拟器）：只交叉编译 + 用 file/readelf 核对 .so 架构与导出。
#     GitHub 托管 runner 跑不了 arm64-v8a 模拟器：macOS 嵌套虚拟化被关（HVF HV_UNSUPPORTED，
#     ReactiveCircus/android-emulator-runner#453 / #350）；Linux arm64 宿主无官方 emulator 二进制。
#     设备端集成测试在 arm64 上仍只有真机冒烟（§90）；本腿只钉住「arm64 .so 能出且架构正确」。
#
# 路径过滤：改动落在会进 APK / 影响设备侧加载的链路上才跑——纯文档提交不再付一次
# 模拟器（§105 原先故意不加，怕漏跑；后与 helper-e2e 同款收窄，漏跑风险用
# 下列清单的广度兜底：lib/android/rust/plugins 整目录 + 构建脚本与依赖锁）。
# core/（Go 内核）不在清单里：本 job 用 `--out config` 跳过内核，用例也不启动它。
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-device.yaml'
      - 'integration_test/**'
      - 'lib/**'
      - 'android/**'
      - 'rust/**'
      - 'plugins/**'
      - 'assets/**'
      - 'arb/**'
      - 'setup.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/android-device.yaml'
      - 'integration_test/**'
      - 'lib/**'
      - 'android/**'
      - 'rust/**'
      - 'plugins/**'
      - 'assets/**'
      - 'arb/**'
      - 'setup.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 与 build.yaml 一致，也就是 android/{app,core}/build.gradle.kts 里 pin 的 ndkVersion。
  NDK_VERSION: 28.2.13676358

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # x86_64：完整设备端集成测试（模拟器）。
  emulator-x86_64:
    runs-on: ubuntu-24.04
    # 第二道闸：`flutter test` 内部的 `adb install` 没有超时，设备端装包一旦挂住会一直等
    # （本机踩过两次，见 stage-log §96/§98）。第一道闸是下面测试步骤里的 `timeout`。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Rust (Android x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Setup Java (Android)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$sdk" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME 都为空，找不到 Android SDK" >&2
            exit 1
          fi
          ndk_dir="${sdk}/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk_dir" ]; then
            # sdkmanager 会问一次许可，用 yes 喂进去。`shell: bash` 带 `-o pipefail`，
            # sdkmanager 读完退出后 yes 会拿到 SIGPIPE（Broken pipe）而让整条管道判失败，
            # 所以这里只关掉 pipefail，退出码仍以 sdkmanager 为准。
            set +o pipefail
            yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
            set -o pipefail
          fi
          test -d "$ndk_dir" || {
            echo "NDK ${NDK_VERSION} 未就位：${ndk_dir}" >&2
            exit 1
          }
          echo "ANDROID_NDK=${ndk_dir}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-device-x86_64-${{ hashFiles('**/pubspec.lock') }}
          # 版本单一来源：pubspec.yaml 的 environment.flutter
          flutter-version-file: pubspec.yaml

      # 生成代码（*.freezed.dart / *.g.dart）已入库，这里只拉取依赖；setup.dart 也依赖它。
      - name: Install Dependencies
        run: flutter pub get

      # 只出 x86_64 一份 ABI。`--out config` 跳过 Go 内核：本用例不启动内核，
      # 而 android/core 的 CMake 在缺 libclash.so 时会正常降级（会打印 Not found 后照常链接）。
      - name: Build Rust native lib (Android x86_64)
        run: dart setup.dart android --arch amd64 --out config

      # 先卡住这一关再启动模拟器：缺 .so 时用例的失败信息（isAvailable 为假）不如这里直白，
      # 而模拟器启动是本任务里最贵的一步。
      - name: Verify Rust native lib is in place
        shell: bash
        run: |
          so=libclash/android/x86_64/libbettbox_native.so
          if [ ! -f "$so" ]; then
            echo "缺少 $so：APK 里不会有 Rust 库，配置管道与脚本引擎在设备上会直接报错" >&2
            exit 1
          fi
          file "$so"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # 这个 action 会把 script 按换行拆成一条条独立的 `sh -c`（lib/script-parser.js），
          # 变量和 if 都活不过一行，所以下面必须折成单行（`>-` 把换行折成空格）。
          # `timeout` 是超时闸：`flutter test` 内部的 `adb install` 没有超时，装包挂住会一直等。
          script: >-
            device=$(adb devices | awk 'NR > 1 && $2 == "device" { print $1; exit }');
            if [ -z "$device" ]; then echo "没有已就绪的设备" >&2; adb devices >&2; exit 1; fi;
            echo "设备：$device";
            timeout --kill-after=60s 20m flutter test integration_test/android_rust_pipeline_test.dart -d "$device"

  # arm64-v8a：不跑模拟器（托管 runner 不可用），只交叉编译并核对 .so 架构与导出。
  # 闭的是 B⑬「模拟器仅 x86_64」里能在 CI 钉住的那一半；设备端集成测试仍只在 x86_64 腿。
  build-arm64-v8a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Rust (Android arm64-v8a)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$sdk" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME 都为空，找不到 Android SDK" >&2
            exit 1
          fi
          ndk_dir="${sdk}/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk_dir" ]; then
            set +o pipefail
            yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
            set -o pipefail
          fi
          test -d "$ndk_dir" || {
            echo "NDK ${NDK_VERSION} 未就位：${ndk_dir}" >&2
            exit 1
          }
          echo "ANDROID_NDK=${ndk_dir}" >> "$GITHUB_ENV"

      # setup.dart 是 Dart 脚本；没有 Flutter SDK 就没有 dart 在 PATH（首跑 127：dart: command not found）。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-device-arm64-v8a-${{ hashFiles('**/pubspec.lock') }}
          flutter-version-file: pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Rust native lib (Android arm64-v8a)
        run: dart setup.dart android --arch arm64 --out config

      - name: Verify arm64 .so architecture and exports
        shell: bash
        run: |
          so=libclash/android/arm64-v8a/libbettbox_native.so
          if [ ! -f "$so" ]; then
            echo "缺少 $so：arm64 APK 里不会有 Rust 库" >&2
            exit 1
          fi
          file "$so"
          # 架构必须是 ARM aarch64，不能误链成宿主 x86_64（setup.dart 缺 CC 时会静默退回 gcc）。
          if ! file "$so" | grep -qi 'ARM aarch64\|ARM64'; then
            echo "架构不对，应是 aarch64：" >&2
            file "$so" >&2
            exit 1
          fi
          # 导出与 golden/导出面一致：配置管道 + 脚本引擎入口（B⑧ 后保留的 bb_*）。
          llvm_nm=$(ls "${ANDROID_NDK}/toolchains/llvm/prebuilt/"*/bin/llvm-nm 2>/dev/null | head -1)
          if [ -z "$llvm_nm" ]; then
            echo "找不到 llvm-nm，无法核对导出" >&2
            exit 1
          fi
          syms=$("$llvm_nm" -D --defined-only "$so" | awk '{ print $3 }' | grep '^bb_' | sort -u)
          echo "bb_* 导出："
          echo "$syms"
          for need in bb_process_profile bb_patch_config bb_eval_script bb_string_free; do
            if ! echo "$syms" | grep -qx "$need"; then
              echo "缺少导出 $need" >&2
              exit 1
            fi
          done
          echo "arm64 .so 架构与关键导出均 OK"
