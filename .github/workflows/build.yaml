name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # 出货只发布两种附件：android-arm64-v8a.apk 与 windows-amd64-setup.exe。
        # universal APK 与 Windows ARM64 构建腿已停用，避免 Release 出现第三、四种产物。
        include:
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: windows
            os: windows-2022
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          # 版本单一来源：pubspec.yaml 的 environment.flutter
          flutter-version-file: pubspec.yaml
          # flutter-action 默认按 runner.arch 找发布包，而 Flutter 的 Windows 发布
          # 清单只有 x64（dart_sdk_arch 恒为 x64），在 windows-11-arm 上按 ARM64 找
          # 会 not found。统一装 x64 SDK；arm64 腿随后立刻把 Dart SDK 换成同 engine
          # 的 arm64 版（见下一步）。
          architecture: X64

      # Flutter 发布包只带 x64 Dart SDK，而 `flutter build windows` 的目标架构取自
      # 当前 Dart VM 的 Abi（x64 Dart 只会编出 x64 包）。engine 产物桶里有
      # dart-sdk-windows-arm64.zip 与全套 windows-arm64 引擎产物，把 bin/cache/dart-sdk
      # 换成同 engine 版本的 arm64 版后，flutter 才会以 -A ARM64 生成 CMake 工程、
      # 下载 windows-arm64 产物，输出落到 build/windows/arm64/。
      # 必须赶在任何 flutter / dart 调用（Install Dependencies）之前执行。
      - name: Use native ARM64 Dart SDK (Windows arm64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $root = $env:FLUTTER_ROOT
          if (-not $root) { $root = Split-Path (Split-Path (Get-Command flutter).Source) }
          $dest = Join-Path $root 'bin\cache\dart-sdk'
          $dart = Join-Path $dest 'bin\dart.exe'
          # 已经是 arm64（缓存命中且上次换过）就跳过下载。
          $ver = & $dart --version 2>&1 | Out-String
          if ($ver -match 'windows_arm64') {
            Write-Host "Dart SDK already arm64: $ver"
            exit 0
          }
          $eng = (Get-Content (Join-Path $root 'bin\internal\engine.version') -Raw).Trim()
          $url = "https://storage.googleapis.com/flutter_infra_release/flutter/$eng/dart-sdk-windows-arm64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'dart-sdk-windows-arm64.zip'
          Write-Host "Downloading $url"
          curl.exe -fsSL --retry 5 -o $zip $url
          if ($LASTEXITCODE -ne 0) { Write-Error "download failed"; exit 1 }
          $tmp = Join-Path $env:RUNNER_TEMP 'dart-sdk-arm64-extract'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive $zip -DestinationPath $tmp
          # 兼容两种压缩包布局：顶层 dart-sdk/ 目录，或直接是 bin/lib。
          $src = $tmp
          $nested = Join-Path $tmp 'dart-sdk'
          if (Test-Path (Join-Path $nested 'bin\dart.exe')) { $src = $nested }
          if (-not (Test-Path (Join-Path $src 'bin\dart.exe'))) {
            Write-Error "extracted archive has no bin\dart.exe"
            exit 1
          }
          Remove-Item $dest -Recurse -Force
          Move-Item $src $dest
          $ver = & $dart --version 2>&1 | Out-String
          Write-Host $ver
          if ($ver -notmatch 'windows_arm64') {
            Write-Error "Dart SDK is not arm64 after swap: $ver"
            exit 1
          }

      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Setup Keystore (Android, optional)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE secret 未配置，Android release 将回退到 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      # 生成代码（*.freezed.dart / *.g.dart）已入库，这里只拉取依赖。
      # 若改动数据模型需要重新生成，可在本地执行 build_runner 后再提交。
      - name: Install Dependencies
        shell: bash
        run: flutter pub get

      - name: Build (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
        run: |
          dart setup.dart android --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      # Rust 原生库（配置管道 + 脚本引擎）在 Android 上默认开启，缺 .so 会静默回退 Dart/qjs、
      # 不报错，所以这里硬断言它真的进了 APK。按 ABI 逐个核对：凡是打了 libclash.so 的 ABI 目录，
      # 都必须同时有 libbettbox_native.so——两边的 ABI 集由同一次 setup.dart 决定，不该出现缺口。
      - name: Verify Rust native lib (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "dist/ 下没有 APK" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            entries=$(unzip -Z1 "$apk")
            if [ -z "$entries" ]; then
              echo "列不出 APK 内容（unzip 缺失或包损坏）：$apk" >&2
              exit 1
            fi
            # ABI 以包里的 libclash.so 为准：这几个目录必须同时带上 Rust 库，
            # 任何一边缺都是打包链路缺口，不是可以跳过的情形。
            abis=$(printf '%s\n' "$entries" | sed -n 's#^lib/\([^/]*\)/libclash\.so$#\1#p' | sort -u)
            if [ -z "$abis" ]; then
              echo "$apk 里没有 libclash.so，打包链路异常" >&2
              exit 1
            fi
            for abi in $abis; do
              printf '%s\n' "$entries" | grep -qx "lib/$abi/libbettbox_native.so" || {
                echo "$apk 的 $abi 缺 libbettbox_native.so" >&2
                exit 1
              }
            done
            echo "$apk 通过：$(printf '%s ' $abis)"
          done

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256 (TOKEN for Helper): $coreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $coreHash

      # 必须在 flutter build 之前产出 libclash/windows/bettbox_native.dll，
      # windows/CMakeLists.txt 才会把它装进 bundle（该文件在 .gitignore 里，只能现造）。
      # 同一目录还会得到系统代理看门狗 BettboxProxyGuard.exe（同一次 cargo build 的副产物），
      # CMake 一并装进 bundle。
      - name: Build Rust native lib (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart setup.dart windows --arch ${{ matrix.arch }} --out config

      - name: Build Bettbox (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          $flutterArgs = @(
            "build", "windows", "--release",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-${{ matrix.arch }}-setup.exe"
          )
          if ($env:SENTRY_DSN) {
            $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          if ($env:IPINFO_TOKEN) {
            $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN"
          }
          flutter @flutterArgs

      # Rust 原生库（配置管道 + 脚本引擎）是唯一实现，缺 dll 时应用会直接报错而不是
      # 静默降级，所以这里硬断言它真的在包里。系统代理看门狗同理（缺了只退化为
      # 「等下次启动还原」，但打包链路不该悄悄丢文件），一并断言在场且与 cargo 产物一致。
      # 脚本内保持纯 ASCII：PowerShell 5.1 会把无 BOM 的 .ps1 按 ANSI 读，中文会让它解析失败。
      - name: Verify Rust native lib (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64' }
          $bundleDir = "build/windows/$dir/runner/Release"
          $bundled = "$bundleDir/bettbox_native.dll"
          if (-not (Test-Path $bundled)) {
            Write-Error "bundle is missing $bundled - the Rust pipeline and script engine will not be active"
            exit 1
          }
          $a = (Get-FileHash $bundled -Algorithm SHA256).Hash
          $b = (Get-FileHash rust/target/release/bettbox_native.dll -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Error "bundled dll differs from the cargo artifact ($a vs $b)"
            exit 1
          }
          $guard = "$bundleDir/BettboxProxyGuard.exe"
          if (-not (Test-Path $guard)) {
            Write-Error "bundle is missing $guard - the proxy guard will not ship"
            exit 1
          }
          $ga = (Get-FileHash $guard -Algorithm SHA256).Hash
          $gb = (Get-FileHash rust/target/release/BettboxProxyGuard.exe -Algorithm SHA256).Hash
          if ($ga -ne $gb) {
            Write-Error "bundled proxy guard differs from the cargo artifact ($ga vs $gb)"
            exit 1
          }
          $appSo = "$bundleDir/data/app.so"
          $text = [System.Text.Encoding]::GetEncoding('ISO-8859-1').GetString([System.IO.File]::ReadAllBytes($appSo))
          $marker = ([regex]::Matches($text, 'bettbox_native\.dll')).Count
          if ($marker -lt 1) {
            Write-Error "app.so has no Rust pipeline marker - the enabled wrapper may have been tree-shaken"
            exit 1
          }
          Write-Host "bettbox_native.dll and BettboxProxyGuard.exe match (marker count = $marker)"

      # Dart 侧与 Rust 库相关的测试（test/rust/）。Rust 管道是唯一实现：缺 dll 时这些
      # 用例会直接报错、不会静默跳过，所以先硬断言产物真的在。cargo 产物在 .gitignore 里，
      # 这一步不会弄脏工作区。（golden 全量比对由 rust 工作流的 `cargo test` 负责。）
      - name: Dart tests against Rust native lib (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "rust/target/release/bettbox_native.dll")) {
            Write-Error "rust/target/release/bettbox_native.dll is missing - the Rust build step should have produced it"
            exit 1
          }
          flutter test test/rust
          if ($LASTEXITCODE -ne 0) {
            Write-Error "test/rust failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "test/rust passed"

      - name: Ensure Inno Setup (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./dist/*
          archive: false
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Bettbox-*
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          notes=".github/release-notes/versions/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "缺少该版本的发布说明：$notes（每个版本一份，见 .github/release-notes/README.md）" >&2
            exit 1
          fi
          cp "$notes" release.md
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: ${{ steps.notes.outputs.version }}
          files: ./dist/*
          body_path: ./release.md
          prerelease: ${{ contains(github.ref_name, 'pre') }}
