name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: android
            os: ubuntu-24.04
            arch: universal
          - platform: windows
            os: windows-2022
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: '3.44.9'

      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Setup Keystore (Android, optional)
        if: matrix.platform == 'android'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE secret 未配置，Android release 将回退到 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      # 生成代码（*.freezed.dart / *.g.dart）已入库，这里只拉取依赖。
      # 若改动数据模型需要重新生成，可在本地执行 build_runner 后再提交。
      - name: Install Dependencies
        shell: bash
        run: flutter pub get

      - name: Build (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
        run: |
          dart setup.dart android --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256 (TOKEN for Helper): $coreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $coreHash

      # 必须在 flutter build 之前产出 libclash/windows/bettbox_native.dll，
      # windows/CMakeLists.txt 才会把它装进 bundle（该文件在 .gitignore 里，只能现造）。
      - name: Build Rust native lib (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart setup.dart windows --arch ${{ matrix.arch }} --out config

      - name: Build Bettbox (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          $flutterArgs = @(
            "build", "windows", "--release",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-${{ matrix.arch }}-setup.exe"
          )
          if ($env:SENTRY_DSN) {
            $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN"
          }
          if ($env:IPINFO_TOKEN) {
            $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN"
          }
          flutter @flutterArgs

      # Rust 原生库（配置管道 + 脚本引擎）默认开启，缺 dll 只会静默回退 Dart/qjs、不报错，
      # 所以这里硬断言它真的在包里。
      # 脚本内保持纯 ASCII：PowerShell 5.1 会把无 BOM 的 .ps1 按 ANSI 读，中文会让它解析失败。
      - name: Verify Rust native lib (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleDir = "build/windows/x64/runner/Release"
          $bundled = "$bundleDir/bettbox_native.dll"
          if (-not (Test-Path $bundled)) {
            Write-Error "bundle is missing $bundled - the Rust pipeline and script engine will not be active"
            exit 1
          }
          $a = (Get-FileHash $bundled -Algorithm SHA256).Hash
          $b = (Get-FileHash rust/target/release/bettbox_native.dll -Algorithm SHA256).Hash
          if ($a -ne $b) {
            Write-Error "bundled dll differs from the cargo artifact ($a vs $b)"
            exit 1
          }
          $appSo = "$bundleDir/data/app.so"
          $text = [System.Text.Encoding]::GetEncoding('ISO-8859-1').GetString([System.IO.File]::ReadAllBytes($appSo))
          $marker = ([regex]::Matches($text, 'bettbox_native\.dll')).Count
          if ($marker -lt 1) {
            Write-Error "app.so has no Rust pipeline marker - the enabled wrapper may have been tree-shaken"
            exit 1
          }
          Write-Host "bettbox_native.dll matches (marker count = $marker)"

      # Rust vs Dart/qjs 的差分套件（test/rust/）。脚本引擎的差分需要一个 qjs 参考实现：
      # `flutter test` 下 flutter_qjs 只从 `test/build/Debug/ffiquickjs.dll` 加载引擎
      # （plugins/flutter_qjs/lib/src/ffi.dart 按 FLUTTER_TEST 分支），而那个 dll 链了
      # flutter_windows.dll，所以把 runner 目录一并放进 PATH。test/build/ 在 .gitignore 里，
      # 这个拷贝不会弄脏工作区。缺 fixtures 或 Rust dll 都会直接失败，不会静默跳过。
      - name: Differential tests Rust vs Dart (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runner = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$runner/flutter_qjs_plugin.dll")) {
            Write-Error "$runner/flutter_qjs_plugin.dll is missing - flutter build windows should have produced it"
            exit 1
          }
          if (-not (Test-Path "rust/target/release/bettbox_native.dll")) {
            Write-Error "rust/target/release/bettbox_native.dll is missing - the Rust build step should have produced it"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path test/build/Debug | Out-Null
          Copy-Item "$runner/flutter_qjs_plugin.dll" test/build/Debug/ffiquickjs.dll -Force
          $env:PATH = "$((Resolve-Path $runner).Path);$env:PATH"
          flutter test test/rust
          if ($LASTEXITCODE -ne 0) {
            Write-Error "differential tests failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "differential tests passed"

      - name: Ensure Inno Setup (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./dist/*
          archive: false
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Bettbox-*
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          notes=".github/release-notes/versions/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "缺少该版本的发布说明：$notes（每个版本一份，见 .github/release-notes/README.md）" >&2
            exit 1
          fi
          cp "$notes" release.md
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: ${{ steps.notes.outputs.version }}
          files: ./dist/*
          body_path: ./release.md
          prerelease: ${{ contains(github.ref_name, 'pre') }}
