[package]
name = "bettbox-config"
description = "Bettbox-Mod 配置改写管道的 Rust 实现"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bettbox_config"
# cdylib 供 Dart 通过 FFI 加载；rlib 让 Rust 测试与后续 crate 能正常链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
