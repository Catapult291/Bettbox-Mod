[package]
name = "bettbox-native"
description = "Bettbox-Mod 的 Rust 原生实现：配置改写管道 + 覆写脚本引擎（内嵌 QuickJS）"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bettbox_native"
# cdylib 供 Dart 通过 FFI 加载；rlib 让 Rust 测试与后续 crate 能正常链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 系统代理（WinINet / RAS）只在 Windows 上编译，见 src/system_proxy.rs。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinInet",
    "Win32_System_Memory",
] }

[build-dependencies]
# 编译仓库里那份 vendored QuickJS（见 build.rs 的说明）。
cc = "1"
