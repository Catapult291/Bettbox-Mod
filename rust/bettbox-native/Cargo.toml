[package]
name = "bettbox-native"
description = "Bettbox-Mod 的 Rust 原生实现：配置改写管道 + 覆写脚本引擎（内嵌 QuickJS）"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bettbox_native"
# cdylib 供 Dart 通过 FFI 加载；rlib 让 Rust 测试与后续 crate 能正常链接。
crate-type = ["cdylib", "rlib"]

# 系统代理看门狗：应用启动时拉起，等应用进程退出后按快照还原系统代理。
# GUI 子系统（`windows_subsystem = "windows"`），全程无窗口。
[[bin]]
name = "BettboxProxyGuard"
path = "src/bin/bettbox_proxy_guard.rs"

[dependencies]
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 崩溃收集（路线稿 §4.5）：panic hook + Windows minidump。crate 本身跨平台
# （windows_impl 仅 cfg(windows)），但只在 Windows 目标被 install
# （见 src/ffi_support.rs 与 ProxyGuard main），Android 交叉构建连上也不生效。
crash-dump = { path = "../crash-dump", version = "0.1.0" }

# 系统代理（WinINet / RAS）只在 Windows 上编译，见 src/system_proxy.rs；
# Threading（OpenProcess / WaitForSingleObject）供看门狗等待父进程。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinInet",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 属性测试：随机规则/配置输入上的不变量（tests/property.rs）。随 `cargo test` 一起跑。
proptest = "1"

[build-dependencies]
# 编译仓库里那份 vendored QuickJS（见 build.rs 的说明）。
cc = "1"
