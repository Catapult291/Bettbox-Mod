[package]
name = "bettbox-native-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# 独立工作区：不并入 `rust/Cargo.toml` 的 members，避免 `cargo test --workspace`
# 与 CI 的 debug/release 双跑被 libFuzzer 目标拖累。
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
bettbox-native = { path = "../bettbox-native" }

[[bin]]
name = "rule_parse"
path = "fuzz_targets/rule_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex_matcher"
path = "fuzz_targets/regex_matcher.rs"
test = false
doc = false
bench = false

[[bin]]
name = "patch_config"
path = "fuzz_targets/patch_config.rs"
test = false
doc = false
bench = false
